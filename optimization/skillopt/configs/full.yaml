# Full SkillOpt run over the whole benchmark (train=70, val=11, test=9).
#
# Same wiring as smoke.yaml, with the paper's slow update and meta-skill passes enabled and
# enough steps for the validation gate to move. Costs real model calls: run
# `make -C optimization smoke` first, then `make -C optimization train`.

env:
  name: verification
  out_root: optimization/skillopt/runs/full
  skill_init: optimization/skillopt/verification_env/seed_skill.md
  data_dir: optimization/dataset/data

model:
  backend: claude
  optimizer_backend: claude_chat
  target_backend: claude_chat
  optimizer: claude-sonnet-4-6
  target: claude-sonnet-4-6

train:
  num_epochs: 2
  steps_per_epoch: 5
  batch_size: 4
  accumulation: 1
  batches_per_epoch: 5
  samples_per_epoch: 20
  seed: 42

gradient:
  minibatch_size: 4
  analyst_workers: 4
  failure_only: false
  merge_batch_size: 4

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  use_slow_update: true
  slow_update_samples: 8
  use_meta_skill: true

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 11
  test_env_num: 9
  eval_test: true

workers: 4
agent_timeout: 900
