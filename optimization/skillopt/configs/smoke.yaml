# Real SkillOpt run, small enough to finish in minutes.
#
# The optimizer and the target agent are both the locally installed `claude` CLI
# (`model.backend: claude`), so no API key is required. The environment is the one this
# repository provides; `bootstrap.py` registers it before the trainer starts.
#
#   python3 optimization/skillopt/verification_env/bootstrap.py \
#       --config optimization/skillopt/configs/smoke.yaml --env verification

env:
  name: verification
  out_root: optimization/skillopt/runs/smoke
  skill_init: optimization/skillopt/verification_env/seed_skill.md
  data_dir: optimization/dataset/data

model:
  backend: claude
  optimizer_backend: claude_chat
  target_backend: claude_chat
  optimizer: claude-sonnet-4-6
  target: claude-sonnet-4-6

train:
  num_epochs: 1
  steps_per_epoch: 1
  batch_size: 2
  accumulation: 1
  batches_per_epoch: 1
  samples_per_epoch: 2
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 2
  analyst_workers: 2
  failure_only: false

optimizer:
  learning_rate: 2
  min_learning_rate: 2
  lr_scheduler: constant
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 2
  test_env_num: 0
  eval_test: false

# adapter arguments (passed through to VerificationAdapter.__init__)
workers: 2
agent_timeout: 900
